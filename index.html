<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#262A28">
<title>Esquadro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#EDF0EA; --grade:#DCE3DA; --grafite:#262A28; --grafite2:#5B635E;
  --trena:#F4C20D; --trena2:#C99A00; --vermelho:#C4372C; --azul:#2F5E8C;
  --branco:#FBFCFA; --linha:#C9D2C7; --ok:#3E7A4F;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--papel);color:var(--grafite);font-family:Archivo,system-ui,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.15}
.num{font-stretch:75%;font-variant-numeric:tabular-nums}
.muted{color:var(--grafite2)}
.btn{min-height:48px;padding:0 18px;border-radius:10px;border:1.5px solid var(--grafite);background:var(--branco);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--grafite);color:var(--branco)}
.btn.am{background:var(--trena)}
.btn.perigo{border-color:var(--vermelho);color:var(--vermelho);background:transparent}
.btn.lite{border-color:var(--linha)}
.btn.sm{min-height:40px;padding:0 12px;font-size:15px}
.btn:disabled{opacity:.4}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
label.f{display:block;margin:0 0 14px}
label.f>span{display:block;font-size:14px;color:var(--grafite2);margin-bottom:4px}
label.f small,.hint{display:block;font-size:13px;color:var(--grafite2);margin-top:4px;line-height:1.35}
.i{width:100%;min-height:48px;border:1.5px solid var(--linha);border-radius:8px;background:#fff;padding:8px 12px;font-size:18px}
.i:focus{border-color:var(--grafite);outline:none;box-shadow:0 0 0 3px rgba(244,194,13,.5)}
textarea.i{min-height:84px;resize:vertical;font-size:16px}
input.i.num{font-size:21px;font-weight:600}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.duo{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}

/* ---------- telas de lista ---------- */
.pagina{max-width:920px;margin:0 auto;padding:28px 24px 80px}
.marca{display:flex;align-items:flex-end;gap:16px;margin-bottom:28px}
.marca svg{flex:none}
.marca h1{font-size:44px;font-weight:800;font-stretch:80%;letter-spacing:-.5px}
.marca p{margin:4px 0 0;color:var(--grafite2)}
.lista{display:grid;gap:10px;margin:18px 0}
.item{display:flex;align-items:center;gap:14px;background:var(--branco);border:1.5px solid var(--linha);border-radius:12px;padding:14px 16px;text-align:left;width:100%}
.item:active{border-color:var(--grafite)}
.item h3{font-size:19px}
.item .muted{font-size:14px;margin-top:2px}
.vazio{border:2px dashed var(--linha);border-radius:14px;padding:32px;text-align:center;color:var(--grafite2)}
.aviso{background:#FFF6D6;border:1.5px solid var(--trena2);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:15px}
.secao{margin-top:30px}
.secao>h2{font-size:22px;margin-bottom:12px}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.amb{background:var(--branco);border:1.5px solid var(--linha);border-radius:12px;padding:14px;text-align:left;min-height:108px;display:flex;flex-direction:column;gap:6px}
.amb h3{font-size:18px}
.barra{height:6px;background:var(--grade);border-radius:3px;overflow:hidden;margin-top:auto}
.barra i{display:block;height:100%;background:var(--grafite)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--linha);background:var(--branco);font-weight:600}
.chip.on{background:var(--trena);border-color:var(--grafite)}
.chip.erro{border-color:var(--vermelho)}

/* ---------- editor de ambiente ---------- */
.amb-app{display:grid;grid-template-rows:auto 1fr;height:100dvh}
.topo{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--grafite);color:var(--branco);min-height:60px}
.topo .btn{background:transparent;color:var(--branco);border-color:#5b635e}
.topo select{background:transparent;color:var(--branco);border:1.5px solid #5b635e;border-radius:8px;min-height:44px;padding:0 10px;font-weight:700;font-size:17px;max-width:220px}
.topo select option{color:var(--grafite)}
.abas{display:flex;gap:4px;margin-left:8px;overflow-x:auto;min-width:0;flex:0 1 auto;scrollbar-width:none}
.abas button{min-height:44px;padding:0 14px;border:0;border-radius:8px;background:transparent;color:#c9d2c7;font-weight:600;white-space:nowrap}
.topo>.btn{white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis;display:block;line-height:44px}
.abas button.on{background:var(--trena);color:var(--grafite)}
.status{font-size:13px;color:#c9d2c7;white-space:nowrap}
.work{display:grid;grid-template-columns:1fr 390px;min-height:0}
.work.cheio{grid-template-columns:1fr}
.palco{position:relative;overflow:hidden;min-height:0}
.palco canvas{display:block;width:100%;height:100%;touch-action:none}
.painel{background:var(--branco);border-left:1.5px solid var(--linha);overflow:auto;padding:18px 18px 60px;min-height:0}
.painel h2{font-size:24px;font-weight:800;font-stretch:85%}
.painel h3{font-size:17px;margin:22px 0 10px}
.trilho{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:8px}
.trilho button{width:54px;height:54px;border-radius:12px;border:1.5px solid var(--grafite);background:var(--branco);display:grid;place-items:center;padding:0}
.trilho button.on{background:var(--trena)}
.trilho hr{border:0;height:6px;margin:0}
.dica{position:absolute;left:80px;right:16px;bottom:14px;background:rgba(251,252,250,.94);border:1.5px solid var(--linha);border-radius:10px;padding:10px 14px;font-size:15px;pointer-events:none}
.resultado{background:var(--papel);border-radius:10px;padding:12px 14px;margin:6px 0 14px}
.resultado b{font-size:26px;font-stretch:75%}
.resultado.erro{background:#FBE3E0;color:#7c1f18}
.resultado.ok{background:#E2EFE4}
.lin{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--grade);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;min-height:52px}
.lin .tag{min-width:34px;height:34px;border-radius:17px;border:1.5px solid var(--grafite);display:grid;place-items:center;font-weight:800;background:#fff}
.lin .tag.m{background:var(--trena)}
.lin .v{margin-left:auto;font-weight:700;font-stretch:75%;font-size:19px}
.alerta{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;margin-bottom:8px;border:1.5px solid var(--linha);background:#fff;text-align:left;width:100%;font-size:15px;line-height:1.35}
.alerta.erro{border-color:var(--vermelho);background:#FDF0EE}
.alerta .ic{flex:none;width:22px;height:22px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--grade)}
.alerta.erro .ic{background:var(--vermelho);color:#fff}
.conteudo{overflow:auto;padding:22px 26px 80px}
.conteudo .inner{max-width:900px}
.check{display:flex;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--grade);cursor:pointer;font-size:17px}
.check input{width:28px;height:28px;accent-color:var(--grafite);flex:none}
.check.ok span{color:var(--grafite2);text-decoration:line-through}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.foto{background:#fff;border:1.5px solid var(--linha);border-radius:10px;overflow:hidden;text-align:left;padding:0}
.foto img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.foto div{padding:8px 10px;font-size:14px}
.elev{width:100%;flex:1;min-height:0;display:block;touch-action:manipulation}
.elev-wrap{position:absolute;inset:0;padding:70px 20px 20px;display:flex;flex-direction:column}
.elev-chips{position:absolute;left:16px;top:14px;right:16px}

dialog{border:0;border-radius:16px;padding:0;max-width:min(560px,94vw);width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(38,42,40,.55)}
.dlg{padding:22px}
.dlg h2{font-size:24px;margin-bottom:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--grafite);color:var(--branco);padding:14px 20px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw}
#toast.on{opacity:1}
#print{display:none}

@media (orientation:portrait) and (max-width:1100px){
  .work{grid-template-columns:1fr;grid-template-rows:56% 44%}
  .work.cheio{grid-template-rows:1fr}
  .painel{border-left:0;border-top:1.5px solid var(--linha)}
  .abas button{padding:0 10px}
  .status{display:none}
  .topo>.btn{max-width:130px}
}
@media (max-width:760px){ .status{display:none} .topo select{max-width:130px} }
@media (prefers-reduced-motion:reduce){ #toast{transition:none} }

/* ---------- impressão / PDF ---------- */
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block;color:#111;font-size:11pt}
  .pg{break-before:page}
  .pg:first-child{break-before:auto}
  .cab{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5pt solid #111;padding-bottom:6pt;margin-bottom:10pt}
  .cab h1{font-size:20pt;font-stretch:80%}
  .cab .emp{text-align:right;font-size:10pt}
  #print h2{font-size:15pt;margin:10pt 0 6pt}
  #print h3{font-size:12pt;margin:10pt 0 4pt}
  #print table{width:100%;border-collapse:collapse;font-size:10pt;margin:4pt 0 8pt}
  #print th,#print td{border:0.6pt solid #999;padding:3pt 5pt;text-align:left}
  #print th{background:#eee}
  #print td.n{text-align:right;font-stretch:80%;font-variant-numeric:tabular-nums}
  #print .planta{width:100%;border:0.6pt solid #999}
  #print .elevp{width:100%;max-height:95mm;border:0.6pt solid #ccc;margin-bottom:4pt}
  #print .bloco{break-inside:avoid}
  #print .fg{display:grid;grid-template-columns:1fr 1fr;gap:6pt}
  #print .fg figure{margin:0;break-inside:avoid}
  #print .fg img{width:100%;max-height:70mm;object-fit:cover;border:0.6pt solid #999}
  #print figcaption{font-size:9pt}
  #print .al{border-left:3pt solid #C4372C;padding:2pt 6pt;margin:3pt 0;font-size:10pt}
  #print .al.av{border-left-color:#C99A00}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<input type="file" id="arqFoto" accept="image/*" capture="environment" hidden>
<input type="file" id="arqGaleria" accept="image/*" multiple hidden>
<input type="file" id="arqBackup" accept="application/json,.json" hidden>

<script>
'use strict';
/* =========================================================
   Esquadro — levantamento de medidas para móveis planejados
   Entrega 1: levantamento (planta 2D, vistas, checklist, fotos, PDF técnico)
   ========================================================= */
const VERSAO = '1.0.1';

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const r10 = v => Math.round(v / 10) * 10;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const letra = i => i < 26 ? String.fromCharCode(65 + i) : 'P' + (i + 1);
const dataBR = t => new Date(t).toLocaleDateString('pt-BR');
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2800);
}
const ICO = {
  caneta: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M14 7l3 3"/></svg>',
  mao: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>',
  orto: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4v15h15"/><path d="M5 14h5v5"/></svg>',
  desfazer: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>',
  enquadrar: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>',
  marca: '<svg width="58" height="58" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#F4C20D"/><path d="M16 12v36h36v-10H26V12z" fill="#262A28"/><path d="M20 44h4M20 38h2M20 32h4M20 26h2M20 20h4" stroke="#F4C20D" stroke-width="2"/></svg>'
};

/* ---------- configuração ---------- */
const cfg = { empresa: '', responsavel: '', telefone: '', unidade: 'mm', tolerancia: 5, dedoDesenha: false };
function fmtLen(mm, suf = true) {
  if (mm == null || isNaN(mm)) return '—';
  if (cfg.unidade === 'cm') {
    const v = (Math.round(mm) / 10).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
    return suf ? v + ' cm' : v;
  }
  const v = String(Math.round(mm));
  return suf ? v + ' mm' : v;
}
function parseLen(str) {
  if (str == null) return null;
  const s = String(str).trim().replace(',', '.');
  if (s === '') return null;
  const v = parseFloat(s);
  if (isNaN(v)) return null;
  return cfg.unidade === 'cm' ? v * 10 : v;
}
function toInput(mm) {
  if (mm == null) return '';
  if (cfg.unidade === 'cm') return String(Math.round(mm) / 10).replace('.', ',');
  return String(Math.round(mm));
}
const un = () => cfg.unidade;

/* ---------- banco local (IndexedDB) ---------- */
const DB = {
  db: null, ok: false,
  mem: { projetos: new Map(), fotos: new Map(), config: new Map() },
  async abrir() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('esquadro', 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          d.createObjectStore('projetos', { keyPath: 'id' });
          const f = d.createObjectStore('fotos', { keyPath: 'id' });
          f.createIndex('projetoId', 'projetoId');
          d.createObjectStore('config', { keyPath: 'k' });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
      this.ok = true;
    } catch (e) { this.ok = false; }
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode);
      const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error);
    });
  },
  put(store, obj) {
    if (!this.ok) { this.mem[store].set(obj.id ?? obj.k, obj); return Promise.resolve(); }
    return this.tx(store, 'readwrite', s => s.put(obj));
  },
  get(store, key) {
    if (!this.ok) return Promise.resolve(this.mem[store].get(key));
    return this.tx(store, 'readonly', s => s.get(key));
  },
  all(store) {
    if (!this.ok) return Promise.resolve([...this.mem[store].values()]);
    return this.tx(store, 'readonly', s => s.getAll());
  },
  del(store, key) {
    if (!this.ok) { this.mem[store].delete(key); return Promise.resolve(); }
    return this.tx(store, 'readwrite', s => s.delete(key));
  },
  fotosDe(pid) {
    if (!this.ok) return Promise.resolve([...this.mem.fotos.values()].filter(f => f.projetoId === pid));
    return this.tx('fotos', 'readonly', s => s.index('projetoId').getAll(pid));
  }
};

/* ---------- modelos ---------- */
const TIPOS = { cozinha: 'Cozinha', dormitorio: 'Dormitório', banheiro: 'Banheiro', lavanderia: 'Lavanderia', sala: 'Sala', escritorio: 'Home office', closet: 'Closet', outro: 'Outro ambiente' };
function novoProjeto() {
  return { id: uid(), cliente: { nome: '', telefone: '', endereco: '', obs: '' }, ambientes: [], criadoEm: Date.now(), atualizadoEm: Date.now() };
}
function novoAmbiente(tipo, existentes) {
  let nome = TIPOS[tipo];
  const n = existentes.filter(a => a.tipo === tipo).length;
  if (n) nome += ' ' + (n + 1);
  return { id: uid(), tipo, nome, peDireito: { a: null, b: null, c: null }, planta: { origem: { x: 0, y: 0 }, fechado: false, inverter: false, paredes: [] }, cantos: {}, checklist: {}, obs: '' };
}
function novaParede(ang, len) {
  return { id: uid(), ang, lenEsboco: len, med: { base: null, meio: null, topo: null }, prumo: null, rodape: { h: null, esp: null }, pontos: [], obs: '' };
}

const PONTOS = {
  tomada:      { n: 'Tomada', c: 'T', cor: '#9A7300', y: 300 },
  interruptor: { n: 'Interruptor', c: 'I', cor: '#9A7300', y: 1100 },
  agua:        { n: 'Ponto de água', c: 'A', cor: '#2F5E8C', y: 600 },
  esgoto:      { n: 'Esgoto', c: 'E', cor: '#5B635E', y: 500 },
  gas:         { n: 'Gás', c: 'G', cor: '#C8641B', y: 600 },
  janela:      { n: 'Janela', box: true, cor: '#2F5E8C', w: 1200, h: 1200, y: 1000 },
  porta:       { n: 'Porta', box: true, cor: '#5B635E', w: 800, h: 2100, y: 0 },
  viga:        { n: 'Viga', box: true, cor: '#262A28', w: null, h: 300, y: null },
  pilar:       { n: 'Pilar', box: true, cor: '#262A28', w: 300, h: null, y: 0 },
  ar:          { n: 'Ar-condicionado', box: true, cor: '#2F5E8C', w: 900, h: 300, y: 2100 },
  quadro:      { n: 'Quadro elétrico', box: true, cor: '#9A7300', w: 300, h: 400, y: 1500 },
  outro:       { n: 'Outro', c: '?', cor: '#5B635E', y: 1000 }
};

const CHECK_BASE = [
  ['Obra pronta para medir', ['Piso final instalado', 'Rodapé instalado ou modelo definido', 'Portas e janelas instaladas com guarnição', 'Forro, gesso e sancas finalizados', 'Pontos elétricos e hidráulicos definidos']],
  ['Medição', ['Cada parede medida em 3 alturas', 'Pé-direito medido em 3 pontos', 'Esquadro conferido em todos os cantos', 'Prumo das paredes conferido', 'Nível do piso conferido', 'Vigas, pilares e sancas registrados', 'Tomadas e interruptores registrados', 'Foto de cada parede']],
  ['Com o cliente', ['O que vai ser guardado nos móveis', 'Cores, padrões de MDF e puxadores', 'Altura de quem mais usa o ambiente', 'Prazo e faixa de orçamento']]
];
const CHECK_TIPO = {
  cozinha: ['Geladeira: largura, altura, profundidade e abertura da porta', 'Fogão ou cooktop e forno: modelo e medidas', 'Coifa ou depurador: modelo e saída do duto', 'Cuba e torneira: modelo e altura da torneira', 'Lava-louças: sim ou não, e medidas', 'Micro-ondas: embutido ou livre', 'Ponto de gás e registro', 'Água e esgoto da pia: altura e posição'],

  outro: []

function checklistDe(amb) {
  const g = CHECK_BASE.map(([t, it]) => [t, it]);
  const esp = CHECK_TIPO[amb.tipo] || [];
  if (esp.length) g.splice(2, 0, [TIPOS[amb.tipo] + ': itens do ambiente', esp]);
  return g;
}

/* ---------- geometria ---------- */
function medProjeto(med) {
  const v = [med.base, med.meio, med.topo].filter(x => x != null && x > 0);
  return v.length ? Math.min(...v) : null;
}
function variacao(med) {
  const v = [med.base, med.meio, med.topo].filter(x => x != null && x > 0);
  return v.length >= 2 ? Math.max(...v) - Math.min(...v) : null;
}
function peDireitoProj(amb) {
  const v = [amb.peDireito.a, amb.peDireito.b, amb.peDireito.c].filter(x => x != null && x > 0);
  return v.length ? Math.min(...v) : null;
}
function pip(x, y, poly) {
  let dentro = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if (((a.y > y) !== (b.y > y)) && (x < (b.x - a.x) * (y - a.y) / (b.y - a.y) + a.x)) dentro = !dentro;
  }
  return dentro;
}
function geo(amb) {
  const P = amb.planta, n = P.paredes.length;
  const pts = [{ x: P.origem.x, y: P.origem.y }];
  const walls = [];
  P.paredes.forEach((w, i) => {
    const m = medProjeto(w.med);
    const a = w.ang * Math.PI / 180;
    const dx = Math.cos(a), dy = Math.sin(a);
    const p0 = pts[i];
    let L = m ?? w.lenEsboco;
    // parede de fechamento sem medida se ajusta sozinha para fechar o contorno
    if (P.fechado && i === n - 1 && m == null) {
      const proj = (P.origem.x - p0.x) * dx + (P.origem.y - p0.y) * dy;
      if (proj > 0) L = proj;
    }
    const p1 = { x: p0.x + dx * L, y: p0.y + dy * L };
    pts.push(p1);
    walls.push({ i, w, p0, p1, L, medido: m != null, dx, dy });
  });
  const poly = P.fechado ? pts.slice(0, -1) : pts;
  walls.forEach(g => {
    let nx = -g.dy, ny = g.dx;
    if (P.fechado && poly.length >= 3) {
      const mx = (g.p0.x + g.p1.x) / 2 + nx * 40, my = (g.p0.y + g.p1.y) / 2 + ny * 40;
      if (!pip(mx, my, poly)) { nx = -nx; ny = -ny; }
    } else if (P.inverter) { nx = -nx; ny = -ny; }
    g.nIn = { x: nx, y: ny };
    // quem olha a parede de dentro do ambiente: qual ponta fica à esquerda?
    const fx = -nx, fy = -ny, lx = fy, ly = -fx;
    const d = (g.p0.x - g.p1.x) * lx + (g.p0.y - g.p1.y) * ly;
    g.esq = d > 0 ? 0 : 1;
    g.vEsq = g.esq === 0 ? g.i : g.i + 1;          // índice do canto à esquerda
    g.vDir = g.esq === 0 ? g.i + 1 : g.i;
    if (P.fechado) { g.vEsq %= n; g.vDir %= n; }
  });
  const fim = pts[pts.length - 1];
  const gap = P.fechado ? Math.hypot(fim.x - P.origem.x, fim.y - P.origem.y) : null;
  return { pts, walls, gap, nV: P.fechado ? n : n + (n ? 1 : 0) };
}
// paredes que tocam o canto v
function paredesDoCanto(amb, v) {
  const P = amb.planta, n = P.paredes.length;
  let ant = v - 1, prox = v;
  if (P.fechado) { ant = (v - 1 + n) % n; prox = v % n; }
  return { ant: ant >= 0 && ant < n ? ant : null, prox: prox < n ? prox : null };
}
function anguloProjeto(G, ant, prox) {
  const a = G.walls[ant], b = G.walls[prox];
  const c = (-a.dx) * b.dx + (-a.dy) * b.dy;
  return Math.acos(Math.max(-1, Math.min(1, c))) * 180 / Math.PI;
}
function calcEsquadro(amb, v, G) {
  const c = amb.cantos[v];
  if (!c || !c.a || !c.b || !c.d) return null;
  const cos = (c.a * c.a + c.b * c.b - c.d * c.d) / (2 * c.a * c.b);
  if (cos < -1 || cos > 1) return { invalido: true };
  const ang = Math.acos(cos) * 180 / Math.PI;
  const { ant, prox } = paredesDoCanto(amb, v);
  const proj = (ant != null && prox != null) ? anguloProjeto(G, ant, prox) : 90;
  const dev = ang - proj;
  const Lmax = Math.max(ant != null ? G.walls[ant].L : 0, prox != null ? G.walls[prox].L : 0) || 1000;
  const mm = Math.abs(Math.tan(dev * Math.PI / 180) * Lmax);
  return { ang, proj, dev, mm, Lmax, fora: mm > cfg.tolerancia };
}
function snapAng(deg) {
  deg = ((deg % 360) + 360) % 360;
  if (S.orto) {
    const r90 = Math.round(deg / 90) * 90;
    if (Math.abs(deg - r90) <= 20) return r90 % 360;
    const r45 = Math.round(deg / 45) * 45;
    if (Math.abs(deg - r45) <= 8) return r45 % 360;
  }
  return Math.round(deg) % 360;
}
function rdp(pts, eps) {
  if (pts.length < 3) return pts.slice();
  const a = pts[0], b = pts[pts.length - 1];
  let idx = -1, max = 0;
  const L = Math.hypot(b.x - a.x, b.y - a.y) || 1;
  for (let i = 1; i < pts.length - 1; i++) {
    const p = pts[i];
    const d = Math.abs((b.y - a.y) * p.x - (b.x - a.x) * p.y + b.x * a.y - b.y * a.x) / L;
    if (d > max) { max = d; idx = i; }
  }
  if (max > eps) {
    const l = rdp(pts.slice(0, idx + 1), eps), r = rdp(pts.slice(idx), eps);
    return l.slice(0, -1).concat(r);
  }
  return [a, b];
}
function distSeg(p, a, b) {
  const vx = b.x - a.x, vy = b.y - a.y, L2 = vx * vx + vy * vy || 1;
  let t = ((p.x - a.x) * vx + (p.y - a.y) * vy) / L2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - a.x - t * vx, p.y - a.y - t * vy);
}

/* ---------- alertas ---------- */
function alertas(amb) {
  const A = [], tol = cfg.tolerancia, P = amb.planta, G = geo(amb);
  if (!P.paredes.length) { A.push({ n: 'av', t: 'Nenhuma parede desenhada ainda.' }); return A; }
  G.walls.forEach(g => {
    const nm = letra(g.i), ref = { tipo: 'parede', i: g.i };
    if (!g.medido) A.push({ n: 'av', t: `Parede ${nm} sem medida. O desenho usa o tamanho do croqui.`, ref });
    const v = variacao(g.w.med);
    if (v != null && v > tol) A.push({ n: 'erro', t: `Parede ${nm} varia ${fmtLen(v)} entre as alturas. Projete pela menor medida (${fmtLen(g.L)}).`, ref });
    if (g.w.prumo != null && Math.abs(g.w.prumo) > tol) A.push({ n: 'erro', t: `Parede ${nm} fora de prumo em ${fmtLen(Math.abs(g.w.prumo))}. Preveja enchimento ou folga.`, ref });
  });
  if (P.fechado && G.gap != null && G.gap > tol && G.walls.every(g => g.medido)) {
    A.push({ n: 'erro', t: `O contorno não fecha: sobram ${fmtLen(G.gap)}. Confira as medidas das paredes e o esquadro dos cantos.` });
  }
  for (let v = 0; v < G.nV; v++) {
    const { ant, prox } = paredesDoCanto(amb, v);
    if (ant == null || prox == null) continue;
    const e = calcEsquadro(amb, v, G);
    const ref = { tipo: 'canto', i: v };
    if (!e) A.push({ n: 'av', t: `Canto ${v + 1} sem esquadro conferido.`, ref });
    else if (e.invalido) A.push({ n: 'erro', t: `Canto ${v + 1}: as três medidas do esquadro não formam um triângulo. Meça de novo.`, ref });
    else if (e.fora) A.push({ n: 'erro', t: `Canto ${v + 1} fora de esquadro: ${e.ang.toFixed(1).replace('.', ',')}°, abre ${fmtLen(e.mm)} ao longo de ${fmtLen(e.Lmax)}.`, ref });
  }
  const pd = [amb.peDireito.a, amb.peDireito.b, amb.peDireito.c].filter(x => x);
  if (!pd.length) A.push({ n: 'av', t: 'Pé-direito não medido.', ref: { tipo: 'amb' } });
  else if (pd.length >= 2 && Math.max(...pd) - Math.min(...pd) > tol) A.push({ n: 'erro', t: `Pé-direito varia ${fmtLen(Math.max(...pd) - Math.min(...pd))}. Teto desnivelado: use a menor altura (${fmtLen(Math.min(...pd))}).`, ref: { tipo: 'amb' } });
  const tot = checklistDe(amb).reduce((s, g) => s + g[1].length, 0);
  const feitos = Object.values(amb.checklist).filter(Boolean).length;
  if (feitos < tot) A.push({ n: 'av', t: `Checklist com ${tot - feitos} de ${tot} itens pendentes.`, ref: { tipo: 'aba', aba: 'checklist' } });
  return A;
}
function progresso(amb) {
  const P = amb.planta;
  const tot = checklistDe(amb).reduce((s, g) => s + g[1].length, 0);
  const feitos = Object.values(amb.checklist).filter(Boolean).length;
  const med = P.paredes.filter(w => medProjeto(w.med) != null).length;
  const partes = [P.paredes.length ? med / P.paredes.length : 0, feitos / (tot || 1), peDireitoProj(amb) ? 1 : 0];
  return partes.reduce((a, b) => a + b, 0) / partes.length;
}

function atualizaDica() {
  const el = $('#dica'); if (!el) return;
  const a = amb(), P = a.planta;
  let t = '';

      s += `<text x="${x}" y="${Y(y)}" font-size="${fs * 0.85}" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="800">${tp.c}</text>`;
      s += `<line x1="${x}" x2="${x}" y1="${Y(y) + r}" y2="${Y(0)}" stroke="${tp.cor}" stroke-width="${fs * 0.05}" stroke-dasharray="${fs * 0.25} ${fs * 0.25}"/>`;
      s += `<text x="${x + r * 1.3}" y="${Y(y) - r * 0.2}" font-size="${fs * 0.7}" fill="#262A28">x ${f(x)}</text>`;
      s += `<text x="${x + r * 1.3}" y="${Y(y) + r * 0.9}" font-size="${fs * 0.7}" fill="#5B635E">piso ${f(y)}</text>`;

/* ===== aba fotos ===== */
function urlFoto(f) {
  if (!S.urls.has(f.id)) S.urls.set(f.id, URL.createObjectURL(f.blob));
  return S.urls.get(f.id);
}
async function comprimir(file) {
  const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
  const max = 1600, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.72));
}
function abaFotos(a) {

      const blob = await comprimir(file);

  $('#arqGaleria').onchange = e => { if (e.target.files.length) receber([...e.target.files]); e.target.value = ''; };
  const paredes = a.planta.paredes;
  const inner = h('div', { class: 'inner' },
    h('h2', { style: 'font-size:26px;font-weight:800;font-stretch:85%;margin-bottom:6px' }, `Fotos: ${a.nome}`),
    h('p', { class: 'hint', style: 'margin-bottom:14px' }, 'Fotografe cada parede de frente e os pontos críticos: registros, quadros, cantos tortos. Escolha a parede antes de fotografar.'),
    paredes.length ? h('div', { class: 'chips', style: 'margin-bottom:12px' },
      h('button', { class: 'chip' + (!S.fotoParede ? ' on' : ''), onclick: () => { S.fotoParede = null; render(); } }, 'Ambiente geral'),
      paredes.map((w, j) => h('button', { class: 'chip' + (S.fotoParede === w.id ? ' on' : ''), onclick: () => { S.fotoParede = w.id; render(); } }, `Parede ${letra(j)}`))) : null,
    h('div', { class: 'row', style: 'margin-bottom:18px' },
      h('button', { class: 'btn am', onclick: () => $('#arqFoto').click() }, 'Tirar foto'),
      h('button', { class: 'btn lite', onclick: () => $('#arqGaleria').click() }, 'Escolher da galeria')),
    minhas.length ? h('div', { class: 'fotos' }, minhas.map(f => {
      const pi = paredes.findIndex(w => w.id === f.paredeId);
      return h('button', { class: 'foto', onclick: () => dlgFoto(a, f) },
        h('img', { src: urlFoto(f), alt: f.legenda || 'Foto do ambiente', loading: 'lazy' }),
        h('div', {}, h('b', {}, pi >= 0 ? `Parede ${letra(pi)}` : 'Geral'), f.legenda ? ` ${f.legenda}` : ''));
    })) : h('div', { class: 'vazio' }, 'Nenhuma foto neste ambiente.'));
  return h('div', { class: 'work cheio' }, h('div', { class: 'conteudo' }, inner));
}

function abaResumo(a) {
  const A = alertas(a), G = geo(a), P = a.planta;

        .map(([v, r]) => h('div', { class: 'amb', style: 'min-height:auto' }, h('b', { class: 'num', style: 'font-size:30px' }, v), h('span', { class: 'muted' }, r)))),

/* ---------- PDF técnico ---------- */
function plantaPNG(a) {
  const W = 1600, H = 1050, c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d'), G = geo(a);
  let v = { s: 0.2, ox: W / 2, oy: H / 2 };
  if (a.planta.paredes.length) {
    const xs = G.pts.map(p => p.x), ys = G.pts.map(p => p.y);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys), pad = 170;
    const s = Math.min((W - pad * 2) / Math.max(x1 - x0, 500), (H - pad * 2) / Math.max(y1 - y0, 500));
    v = { s, ox: W / 2 - (x0 + x1) / 2 * s, oy: H / 2 - (y0 + y1) / 2 * s };
  }
  desenharPlanta(ctx, a, W, H, v, { print: true, k: 1.7 });
  return c.toDataURL('image/png');
}
async function gerarPDF(p, ids) {
  const root = $('#print'); root.innerHTML = '';
  const c = p.cliente;
  const cab = () => `<div class="cab"><div><h1>Levantamento técnico</h1><div>${esc(c.nome || 'Cliente')}${c.endereco ? ', ' + esc(c.endereco) : ''}</div><div>${c.telefone ? esc(c.telefone) + ', ' : ''}${dataBR(Date.now())}</div></div><div class="emp"><b>${esc(cfg.empresa || '')}</b><br>${esc(cfg.responsavel || '')}${cfg.telefone ? '<br>' + esc(cfg.telefone) : ''}</div></div>`;
  const fotosTodas = await DB.fotosDe(p.id);
  let html = '';
  for (const id of ids) {
    const a = p.ambientes.find(x => x.id === id); if (!a) continue;
    const G = geo(a), A = alertas(a);
    html += `<section class="pg">${cab()}<h2>${esc(a.nome)}</h2>`;
    const pd = a.peDireito;
    html += `<p>Pé-direito: ${fmtLen(pd.a)}, ${fmtLen(pd.b)}, ${fmtLen(pd.c)}. <b>Projeto: ${fmtLen(peDireitoProj(a))}</b>. Unidade: ${un()}. Tolerância: ${fmtLen(cfg.tolerancia)}.</p>`;
    html += `<img class="planta" src="${plantaPNG(a)}" alt="Planta">`;
    html += `<p style="font-size:9pt;color:#555">Cotas em fundo amarelo foram medidas. Cotas com ~ são estimadas pelo croqui e precisam ser conferidas.</p>`;
    if (G.walls.length) {
      html += `<div class="bloco"><h3>Paredes</h3><table><tr><th>Parede</th><th>Cantos</th><th>Embaixo</th><th>Meio</th><th>Em cima</th><th>Projeto</th><th>Variação</th><th>Prumo</th><th>Rodapé (alt. × esp.)</th></tr>`;
      for (const g of G.walls) {
        const w = g.w, v = variacao(w.med);
        html += `<tr><td><b>${letra(g.i)}</b></td><td>${g.vEsq + 1} a ${g.vDir + 1}</td><td class="n">${fmtLen(w.med.base, false)}</td><td class="n">${fmtLen(w.med.meio, false)}</td><td class="n">${fmtLen(w.med.topo, false)}</td><td class="n"><b>${g.medido ? fmtLen(g.L, false) : '~' + fmtLen(g.L, false)}</b></td><td class="n">${fmtLen(v, false)}</td><td class="n">${fmtLen(w.prumo, false)}</td><td class="n">${fmtLen(w.rodape.h, false)} × ${fmtLen(w.rodape.esp, false)}</td></tr>`;
      }
      html += `</table></div>`;
      let cantos = '';
      for (let v = 0; v < G.nV; v++) {
        const { ant, prox } = paredesDoCanto(a, v); if (ant == null || prox == null) continue;
        const e = calcEsquadro(a, v, G);
        let st = 'Não conferido', ang = '—';
        if (e && e.invalido) st = 'Medidas inválidas';
        else if (e) { ang = e.ang.toFixed(1).replace('.', ',') + '°'; st = e.fora ? `Fora: ${fmtLen(e.mm)} em ${fmtLen(e.Lmax)}` : 'OK'; }
        cantos += `<tr><td><b>${v + 1}</b></td><td>${letra(ant)} e ${letra(prox)}</td><td class="n">${ang}</td><td>${st}</td></tr>`;
      }
      if (cantos) html += `<div class="bloco"><h3>Esquadro dos cantos</h3><table><tr><th>Canto</th><th>Paredes</th><th>Ângulo</th><th>Situação</th></tr>${cantos}</table></div>`;
    }
    if (A.length) html += `<div class="bloco"><h3>Pontos de atenção e pendências</h3>${A.map(x => `<div class="al ${x.n === 'erro' ? '' : 'av'}">${esc(x.t)}</div>`).join('')}</div>`;
    if (a.obs) html += `<div class="bloco"><h3>Observações</h3><p>${esc(a.obs).replace(/\n/g, '<br>')}</p></div>`;
    // vistas
    for (const g of G.walls) {
      const w = g.w;
      html += `<div class="bloco"><h3>Parede ${letra(g.i)} de frente</h3>${elevSVG(a, g.i, { cls: 'elevp' })}`;
      if (w.pontos.length) {
        html += `<table><tr><th>Ponto</th><th>Do canto ${g.vEsq + 1}</th><th>Do piso</th><th>Largura × altura</th><th>Obs.</th></tr>`;
        for (const pt of w.pontos) {
          const tp = PONTOS[pt.tipo] || PONTOS.outro;
          html += `<tr><td>${esc(tp.n)}</td><td class="n">${fmtLen(pt.x, false)}</td><td class="n">${fmtLen(pt.y, false)}</td><td class="n">${tp.box ? fmtLen(pt.w, false) + ' × ' + fmtLen(pt.h, false) : '—'}</td><td>${esc(pt.obs)}</td></tr>`;
        }
        html += `</table>`;
      }
      if (w.obs) html += `<p><b>Obs.:</b> ${esc(w.obs)}</p>`;
      html += `</div>`;
    }
    // checklist
    const grupos = checklistDe(a);
    html += `<div class="bloco"><h3>Checklist</h3><table><tr><th>Item</th><th style="width:22%">Situação</th></tr>`;
    for (const [tit, itens] of grupos) {
      html += `<tr><th colspan="2">${esc(tit)}</th></tr>`;
      for (const t of itens) html += `<tr><td>${esc(t)}</td><td>${a.checklist[t] ? 'Conferido' : '<b>Pendente</b>'}</td></tr>`;
    }
    html += `</table></div>`;
    const fs = fotosTodas.filter(f => f.ambienteId === a.id);
    if (fs.length) {
      html += `<h3>Fotos</h3><div class="fg">`;
      for (const f of fs) {
        const pi = a.planta.paredes.findIndex(w => w.id === f.paredeId);
        html += `<figure><img src="${urlFoto(f)}" alt=""><figcaption>${pi >= 0 ? 'Parede ' + letra(pi) : 'Geral'}${f.legenda ? ': ' + esc(f.legenda) : ''}</figcaption></figure>`;
      }
      html += `</div>`;
    }
    html += `</section>`;
  }
  root.innerHTML = html;
  await Promise.all([...root.querySelectorAll('img')].map(im => im.decode ? im.decode().catch(() => {}) : Promise.resolve()));
  const tituloAnt = document.title;
  const nomeAmb = ids.length === 1 ? ' - ' + (p.ambientes.find(x => x.id === ids[0])?.nome || '') : '';
  document.title = `Levantamento - ${c.nome || 'cliente'}${nomeAmb} - ${new Date().toLocaleDateString('pt-BR').replace(/\//g, '-')}`;
  const volta = () => { document.title = tituloAnt; window.removeEventListener('afterprint', volta); };
  window.addEventListener('afterprint', volta);
  setTimeout(() => window.print(), 120);
}

/* ---------- backup ---------- */
const blobParaB64 = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
async function b64ParaBlob(d) { return (await fetch(d)).blob(); }
async function exportar() {
  const projetos = await DB.all('projetos'), fotos = await DB.all('fotos');
  const fs = [];
  for (const f of fotos) { const { blob, ...meta } = f; fs.push({ ...meta, data: await blobParaB64(blob) }); }
  const dados = { app: 'esquadro', versao: 1, exportadoEm: Date.now(), config: { ...cfg }, projetos, fotos: fs };
  const url = URL.createObjectURL(new Blob([JSON.stringify(dados)], { type: 'application/json' }));
  const a = h('a', { href: url, download: `esquadro-backup-${new Date().toISOString().slice(0, 10)}.json` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Backup baixado. Guarde no Drive ou mande para você mesmo.');
}
async function importar(file) {
  try {
    const d = JSON.parse(await file.text());
    if (d.app !== 'esquadro') throw new Error('arquivo');
    for (const p of d.projetos || []) await DB.put('projetos', p);
    for (const f of d.fotos || []) { const { data, ...meta } = f; await DB.put('fotos', { ...meta, blob: await b64ParaBlob(data) }); }
    toast(`${(d.projetos || []).length} clientes restaurados.`);
    irHome();
  } catch (e) { toast('Esse arquivo não é um backup do Esquadro.'); }
}
function dlgBackup() {
  const dlg = $('#dlg'); dlg.innerHTML = '';
  $('#arqBackup').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) { dlg.close(); importar(f); } };
  dlg.append(h('div', { class: 'dlg' },
    h('h2', {}, 'Backup'),
    h('p', {}, 'Os dados ficam só no tablet. Se o app for desinstalado ou o navegador limpar os dados, tudo se perde. Exporte um backup no fim de cada visita.'),
    h('div', { class: 'row', style: 'margin-top:16px' },
      h('button', { class: 'btn pri', onclick: () => { dlg.close(); exportar(); } }, 'Exportar backup'),
      h('button', { class: 'btn lite', onclick: () => $('#arqBackup').click() }, 'Restaurar backup'),
      h('span', { class: 'sp' }),
      h('button', { class: 'btn lite', onclick: () => dlg.close() }, 'Fechar')),
    h('p', { class: 'hint', style: 'margin-top:12px' }, 'Restaurar junta o backup com o que já está no tablet. Clientes com o mesmo código são substituídos.')));
  dlg.showModal();
}

  if (DB.ok && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (document.fonts) document.fonts.ready.then(() => desenhar());
