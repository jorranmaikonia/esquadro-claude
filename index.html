<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#262A28">
<title>Esquadro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#EDF0EA; --grade:#DCE3DA; --grafite:#262A28; --grafite2:#5B635E;
  --trena:#F4C20D; --trena2:#C99A00; --vermelho:#C4372C; --azul:#2F5E8C;
  --branco:#FBFCFA; --linha:#C9D2C7;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--papel);color:var(--grafite);font-family:Archivo,system-ui,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.15}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--grafite);background:var(--branco);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--grafite);color:var(--branco)}
.btn.am{background:var(--trena)}
.btn.lite{border-color:var(--linha)}
.btn.perigo{border-color:var(--vermelho);color:var(--vermelho);background:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:15px}
.btn:disabled{opacity:.35}
.i{width:100%;min-height:44px;border:1.5px solid var(--linha);border-radius:8px;background:#fff;padding:6px 10px;font-size:17px}
.i:focus{border-color:var(--grafite);outline:none;box-shadow:0 0 0 3px rgba(244,194,13,.5)}
.num{font-stretch:75%;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--grafite);color:var(--branco);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
#toast.on{opacity:1}
dialog{border:0;border-radius:16px;padding:0;max-width:min(520px,94vw);width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(38,42,40,.55)}
.dlg{padding:22px}
.dlg h2{font-size:22px;margin-bottom:14px}
label.f{display:block;margin:0 0 10px}
label.f>span{display:block;font-size:13px;color:var(--grafite2);margin-bottom:4px}
.hint{font-size:13px;color:var(--grafite2);line-height:1.4;margin:6px 0 0}

/* ---------- lista de desenhos ---------- */
.pagina{max-width:1000px;margin:0 auto;padding:28px 24px 80px}
.marca{display:flex;align-items:flex-end;gap:14px;margin-bottom:24px}
.marca h1{font-size:42px;font-weight:800;font-stretch:80%;letter-spacing:-.5px}
.marca p{margin:4px 0 0;color:var(--grafite2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:20px}
.card{background:var(--branco);border:1.5px solid var(--linha);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .th{display:block;width:100%;aspect-ratio:3/2;background:#fff;border:0;border-bottom:1.5px solid var(--linha);padding:0}
.card .th svg{width:100%;height:100%;display:block}
.card .info{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.card .info .row{flex-wrap:nowrap}
.card h3{font-size:17px}
.card small{color:var(--grafite2);font-size:13px}
.vazio{border:2px dashed var(--linha);border-radius:14px;padding:32px;text-align:center;color:var(--grafite2);margin-top:20px}

/* ---------- editor ---------- */
.ed{display:grid;grid-template-rows:auto 1fr;height:100dvh}
.topo{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--grafite);color:var(--branco);min-height:58px;overflow-x:auto;scrollbar-width:none}
.topo .btn{background:transparent;color:var(--branco);border-color:#5b635e;min-height:42px}
.topo .btn.on{background:var(--trena);color:var(--grafite);border-color:var(--trena)}
.topo .ico{width:44px;padding:0}
.topo input.nome{background:transparent;border:1.5px solid transparent;border-radius:8px;color:var(--branco);font-weight:700;font-size:18px;min-height:42px;padding:0 10px;width:220px;min-width:120px}
.topo input.nome:focus{border-color:#5b635e;outline:none}
.topo select.folhas{background:#3a403d;color:var(--branco);border:1.5px solid #5b635e;border-radius:8px;min-height:42px;padding:0 8px;font-weight:700;font-size:15px;max-width:230px}
.topo select.folhas option{color:var(--grafite);background:#fff}
.sep{width:1px;height:28px;background:#5b635e;flex:none}
.corpo{display:grid;grid-template-columns:1fr 330px;min-height:0}
.corpo.sem-painel{grid-template-columns:1fr}
.palco{position:relative;overflow:hidden;min-height:0;background:var(--papel)}
#tela{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;user-select:none;-webkit-user-select:none}
.ferr{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:4px;background:var(--branco);border:1.5px solid var(--linha);border-radius:14px;padding:6px;box-shadow:0 2px 10px rgba(38,42,40,.08);max-height:calc(100% - 20px);overflow-y:auto;scrollbar-width:none}
.ferr button{width:52px;height:50px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;padding:0;color:var(--grafite)}
.ferr button.on{background:var(--trena)}
.ferr hr{border:0;border-top:1.5px solid var(--grade);margin:2px 4px}
.escala{position:absolute;left:80px;bottom:14px;display:flex;align-items:flex-end;gap:10px;pointer-events:none;font-size:13px;font-weight:700}
.escala i{display:block;height:8px;border:2px solid var(--grafite);border-top:0}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.zoom .btn{width:44px;padding:0;background:var(--branco);border-color:var(--linha)}
.dica{position:absolute;left:80px;top:12px;right:12px;display:flex;justify-content:center;pointer-events:none}
.dica span{background:rgba(251,252,250,.95);border:1.5px solid var(--linha);border-radius:10px;padding:8px 12px;font-size:14px;max-width:560px}
.barra-poli{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:var(--branco);border:1.5px solid var(--grafite);border-radius:14px;padding:6px;box-shadow:0 6px 20px rgba(38,42,40,.18);max-width:calc(100% - 100px);overflow-x:auto}
.barra-poli input{width:96px;min-height:40px;border:1.5px solid var(--linha);border-radius:8px;padding:0 8px;font-size:17px;font-weight:700}

.painel{background:var(--branco);border-left:1.5px solid var(--linha);overflow:auto;padding:14px 14px 70px;min-height:0}
.painel h2{font-size:20px;font-weight:800;font-stretch:85%}
.painel h3{font-size:14px;font-weight:700;color:var(--grafite2);margin:18px 0 8px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{min-height:36px;padding:0 10px 0 6px;border-radius:18px;border:1.5px solid var(--linha);background:#fff;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.cat i{width:20px;height:20px;border-radius:10px;border:2.5px solid;display:block}
.cat.on{border-color:var(--grafite);background:#FFF6D6}
.cores{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cor{width:32px;height:32px;border-radius:8px;border:1.5px solid rgba(38,42,40,.25);padding:0}
.cor.on{outline:3px solid var(--grafite);outline-offset:2px}
.cor.nenhum{background:linear-gradient(135deg,#fff 44%,var(--vermelho) 44%,var(--vermelho) 56%,#fff 56%)}
.cores input[type=color]{width:32px;height:32px;border:0;padding:0;background:none}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg button{min-height:40px;border:1.5px solid var(--linha);border-radius:8px;background:#fff;display:grid;place-items:center;padding:0}
.seg button.on{border-color:var(--grafite);background:#FFF6D6}
.slider{display:flex;align-items:center;gap:10px}
.slider input[type=range]{flex:1;accent-color:var(--grafite);height:32px}
.slider b{min-width:58px;text-align:right}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini .i{font-size:17px;font-weight:700;font-stretch:80%}
.chk{display:flex;gap:10px;align-items:center;min-height:40px;font-size:15px;cursor:pointer}
.chk input{width:24px;height:24px;accent-color:var(--grafite);flex:none}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lseg{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;margin-bottom:6px}
.lseg b{height:30px;border-radius:15px;border:1.5px solid var(--grafite);display:grid;place-items:center;font-size:13px}

.ferr button.on.trava{box-shadow:inset 0 0 0 3px var(--grafite)}
.ferr button.on.trava::after{content:"";position:absolute;margin:30px 0 0 30px;width:10px;height:10px;border-radius:5px;background:var(--grafite)}
.ferr button{position:relative}
.formas{position:absolute;left:80px;top:10px;display:flex;flex-wrap:wrap;gap:4px;max-width:calc(100% - 100px);background:var(--branco);border:1.5px solid var(--linha);border-radius:14px;padding:6px;box-shadow:0 2px 10px rgba(38,42,40,.08);z-index:2}
.formas button{width:46px;height:46px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;padding:0}
.formas button.on{background:var(--trena)}
.rapida{position:absolute;display:flex;gap:4px;background:var(--grafite);border-radius:14px;padding:5px;box-shadow:0 8px 24px rgba(38,42,40,.3);z-index:3}
.rapida button{min-width:58px;height:54px;border:0;border-radius:10px;background:transparent;color:var(--branco);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 6px;font-size:11px;font-weight:600}
.rapida button:active{background:#3a403d}
.rapida button.perigo{color:#FF9A8F}
.gaveta{position:absolute;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--branco);border-left:1.5px solid var(--linha);box-shadow:-10px 0 30px rgba(38,42,40,.15);display:flex;flex-direction:column;z-index:6}
.gal-topo{padding:14px 14px 6px;border-bottom:1.5px solid var(--grade)}
.gal-topo .i{margin-top:10px}
.gal-grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));grid-auto-rows:max-content;gap:10px;padding:12px 14px;align-content:start}
.gal-item{border:1.5px solid var(--linha);border-radius:12px;background:#fff;display:flex;flex-direction:column}
.gal-th{display:block;width:100%;border:0;padding:0;background:#fff;aspect-ratio:16/11;border-bottom:1.5px solid var(--grade);border-radius:11px 11px 0 0;overflow:hidden}
.gal-th svg{width:100%;height:100%;display:block}
.gal-info{padding:6px 8px 8px;display:flex;flex-direction:column;gap:1px}
.gal-info b{font-size:13px;line-height:1.2}
.gal-info small{font-size:12px;color:var(--grafite2);font-stretch:85%}
.gal-rodape{padding:10px 14px;border-top:1.5px solid var(--grade);display:flex;gap:8px;flex-wrap:wrap}
.selo-estudio{background:var(--trena);color:var(--grafite);border-radius:8px;padding:4px 10px;font-weight:800;font-size:14px}
@media (orientation:portrait) and (max-width:1100px){
  .corpo{grid-template-columns:1fr;grid-template-rows:1fr 38%}
  .corpo.sem-painel{grid-template-rows:1fr}
  .painel{border-left:0;border-top:1.5px solid var(--linha)}
  .topo input.nome{width:150px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* ---------- impressão em escala ---------- */
#print{display:none}
@media print{
  html,body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block;color:#111}
  #print .cab{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2pt solid #111;padding-bottom:4pt;margin-bottom:6pt;font-size:10pt}
  #print .cab b{font-size:14pt}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<input type="file" id="arqBackup" accept="application/json,.json" hidden>

<script>
'use strict';
/* =========================================================
   Esquadro — editor de desenho para móveis planejados
   Unidade interna: centímetros. Tela: px = cm * s + o
   ========================================================= */
const VERSAO = '2.2.0';

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const f2 = n => Math.round(n * 100) / 100;
const clone = o => JSON.parse(JSON.stringify(o));
const ap = (el, ...k) => el.append(...k.flat().filter(x => x != null && x !== false));
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2600);
}

/* ---------- configuração ---------- */
let COR_FUNDO = '#EDF0EA'; // cor do papel: tapa a parede no vão de portas e janelas
const cfg = { unidade: 'cm', passo: 5, dedo: false, grade: true, ima: true, orto: true };
function fmt(cm, suf = false) {
  if (cm == null || isNaN(cm)) return '—';
  let s;
  if (cfg.unidade === 'mm') s = String(Math.round(cm * 10));
  else if (cfg.unidade === 'm') s = (cm / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  else s = (Math.round(cm * 10) / 10).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
  return suf ? s + ' ' + cfg.unidade : s;
}
function parse(str) {
  const x = parseFloat(String(str ?? '').trim().replace(',', '.'));
  if (isNaN(x)) return null;
  return cfg.unidade === 'mm' ? x / 10 : cfg.unidade === 'm' ? x * 100 : x;
}
const toIn = cm => cm == null ? '' : (cfg.unidade === 'mm' ? String(Math.round(cm * 10)) : cfg.unidade === 'm' ? String(f2(cm / 100)).replace('.', ',') : String(Math.round(cm * 10) / 10).replace('.', ','));
const fmtNum = x => String(Math.round(x * 10) / 10).replace('.', ',');

/* ---------- banco local ---------- */
const DB = {
  db: null, ok: false, mem: { desenhos: new Map(), config: new Map(), biblioteca: new Map() },
  async abrir() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('esquadro-desenho', 2);
        r.onupgradeneeded = () => { const d = r.result; for (const [n, k] of [['desenhos', 'id'], ['config', 'k'], ['biblioteca', 'id']]) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: k }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
      this.ok = true;
    } catch (e) { this.ok = false; }
  },
  tx(st, mode, fn) {
    return new Promise((res, rej) => { const t = this.db.transaction(st, mode); const q = fn(t.objectStore(st)); t.oncomplete = () => res(q ? q.result : undefined); t.onerror = () => rej(t.error); });
  },
  put(st, o) { if (!this.ok) { this.mem[st].set(o.id ?? o.k, clone(o)); return Promise.resolve(); } return this.tx(st, 'readwrite', s => s.put(o)); },
  get(st, k) { if (!this.ok) return Promise.resolve(this.mem[st].get(k)); return this.tx(st, 'readonly', s => s.get(k)); },
  all(st) { if (!this.ok) return Promise.resolve([...this.mem[st].values()].map(clone)); return this.tx(st, 'readonly', s => s.getAll()); },
  del(st, k) { if (!this.ok) { this.mem[st].delete(k); return Promise.resolve(); } return this.tx(st, 'readwrite', s => s.delete(k)); }
};

/* ---------- categorias: cores que distinguem as coisas ---------- */
const CATS = [
  { id: 'parede',     n: 'Parede',       e: { traco: '#262A28', preench: 'none',    pop: 0.5,  esp: 15,  un: 'cm', linha: 'solida' } },
  { id: 'movel',      n: 'Móvel',        e: { traco: '#7A4E22', preench: '#E9C99A', pop: 0.75, esp: 2,   un: 'px', linha: 'solida' } },
  { id: 'porta',      n: 'Porta/janela', e: { traco: '#2F5E8C', preench: 'none',    pop: 0.5,  esp: 2,   un: 'px', linha: 'trac' } },
  { id: 'eletro',     n: 'Eletro',       e: { traco: '#6B5B95', preench: '#E5DDF0', pop: 0.85, esp: 2,   un: 'px', linha: 'solida' } },
  { id: 'eletrica',   n: 'Elétrica',     e: { traco: '#C9700F', preench: '#F8DDB8', pop: 0.85, esp: 2,   un: 'px', linha: 'solida' } },
  { id: 'hidraulica', n: 'Hidráulica',   e: { traco: '#1C7FB0', preench: '#D3ECF7', pop: 0.85, esp: 2,   un: 'px', linha: 'solida' } },
  { id: 'obs',        n: 'Observação',   e: { traco: '#C4372C', preench: 'none',    pop: 0.5,  esp: 2,   un: 'px', linha: 'tracponto' } },
  { id: 'medida',     n: 'Medida',       e: { traco: '#262A28', preench: 'none',    pop: 0.5,  esp: 1.5, un: 'px', linha: 'solida' } }
];
const catDe = id => CATS.find(c => c.id === id);
const estiloCat = id => ({ ...clone(catDe(id).e), cat: id });
const CORES = ['#262A28', '#5B635E', '#A7AFA9', '#FFFFFF', '#C4372C', '#C9700F', '#E8B400', '#3E7A4F', '#1C7FB0', '#2F5E8C', '#6B5B95', '#7A4E22', '#E9C99A', '#F8DDB8', '#D3ECF7', '#E5DDF0', '#DCE8D2', '#F6D3C8'];
const LINHAS = [['solida', 'Contínua'], ['trac', 'Tracejada'], ['pont', 'Pontilhada'], ['tracponto', 'Traço e ponto']];

const FERR = [
  ['sel', 'Selecionar e mover', '<path d="M5 3l14 8-6 1.5L10 19z"/>'],
  ['mao', 'Mover a tela', '<path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/>'],
  null,
  ['parede', 'Parede', '<path d="M3 5h18v4H7v10H3z" fill="currentColor" stroke="none"/>'],
  ['linha', 'Linha', '<path d="M4 19L20 5"/><circle cx="4" cy="19" r="1.6" fill="currentColor"/><circle cx="20" cy="5" r="1.6" fill="currentColor"/>'],
  ['livre', 'Traço livre', '<path d="M3 17c3-6 5 2 8-3s4-8 7-6 2 7 3 7"/>'],
  ['ret', 'Retângulo (móvel)', '<rect x="4" y="6" width="16" height="12" rx="1"/>'],
  ['elipse', 'Círculo e elipse', '<ellipse cx="12" cy="12" rx="8" ry="6"/>'],
  ['formas', 'Mais formas', '<path d="M12 3l3 6h-6z"/><rect x="3" y="13" width="8" height="8" rx="1"/><path d="M17 13l4 4-4 4-4-4z"/>'],
  ['texto', 'Texto', '<path d="M5 6V4h14v2M12 4v16M9 20h6"/>'],
  ['cota', 'Cota (medida)', '<path d="M4 8v8M20 8v8M4 12h16M7 10l-3 2 3 2M17 10l3 2-3 2"/>'],
  null,
  ['biblioteca', 'Biblioteca de móveis e eletros', '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M17.5 14v7M14 17.5h7"/>']
];
const NOME_FERR = Object.fromEntries(FERR.filter(Boolean).map(f => [f[0], f[1]]));

/* ---------- estado ---------- */
const S = {
  tela: 'lista', lista: [], doc: null, ferr: 'sel', sel: [], painel: true,

/* ---------- segurar a caneta: o traço vira forma perfeita ---------- */

    }

      h('button', { class: 'btn lite', onclick: () => { dlg.close(); baixar(new Blob([JSON.stringify({ app: 'esquadro', versao: 2, desenhos: [(sincronizarFolha(), S.doc)] })], { type: 'application/json' }), `${S.doc.nome}.json`); } }, 'Arquivo deste desenho (backup)')),
    h('p', { class: 'hint', style: 'margin-top:12px' }, 'No PDF, escolha "Salvar como PDF" na impressora. A escala (1:20, 1:50…) é escolhida sozinha para caber numa folha A4.'),
    h('div', { class: 'row', style: 'margin-top:10px' }, h('span', { class: 'sp' }), h('button', { class: 'btn lite', onclick: () => dlg.close() }, 'Fechar'))));
  dlg.showModal();
}
// s = px por cm da imagem; k = quanto 1 px de traço/texto vale na imagem
function svgExport(s, k, b, W, H) {
  const guarda = S.doc.vista, se = s / k, fundo = COR_FUNDO;
  S.doc.vista = { s: se, ox: 0, oy: 0 }; COR_FUNDO = '#FFFFFF';
  const g = svgFundoFolha(se) + svgLista(objs(), se);
  S.doc.vista = guarda; COR_FUNDO = fundo;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Archivo, system-ui, sans-serif"><rect width="${W}" height="${H}" fill="#fff"/><g transform="matrix(${s} 0 0 ${s} ${-b.x0 * s} ${-b.y0 * s})">${g}</g></svg>`;
}
async function exportarPNG() {
  const b = limitesFolha(40); if (!b) { toast('O desenho está vazio.'); return; }
  const s = Math.min(3000 / (b.x1 - b.x0), 3000 / (b.y1 - b.y0));
  const W = Math.round((b.x1 - b.x0) * s), H = Math.round((b.y1 - b.y0) * s);
  const k = Math.max(1.5, Math.min(W, H) / 700), rod = Math.round(36 * k);
  const svgTxt = svgExport(s, k, b, W, H + rod).replace('</svg>',
    `<text x="${16 * k}" y="${H + rod * 0.6}" font-size="${16 * k}" font-weight="700" fill="#262A28">${esc(S.doc.nome)} · ${esc(folhaAtual().nome)}</text><text x="${W - 16 * k}" y="${H + rod * 0.6}" font-size="${12 * k}" text-anchor="end" fill="#5B635E">Medidas em ${cfg.unidade}</text></svg>`);
  const img = new Image(), url = URL.createObjectURL(new Blob([svgTxt], { type: 'image/svg+xml' }));
  try { await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; }); }
  catch (e) { toast('Não consegui gerar a imagem.'); return; }
  const c = document.createElement('canvas'); c.width = W; c.height = H + rod;
  c.getContext('2d').drawImage(img, 0, 0); URL.revokeObjectURL(url);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const nome = `${S.doc.nome} - ${folhaAtual().nome}.png`, arq = new File([blob], nome, { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [arq] })) { try { await navigator.share({ files: [arq], title: S.doc.nome }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  baixar(blob, nome);
}
function baixar(blob, nome) {
  const url = URL.createObjectURL(blob), a = h('a', { href: url, download: nome });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}
// uma página A4 por folha, cada uma na maior escala padrão que couber
function paginaEscala() {
  const b = limitesFolha(20); if (!b) return null;
  const Wcm = b.x1 - b.x0, Hcm = b.y1 - b.y0, paisagem = Wcm >= Hcm;
  const papel = paisagem ? { w: 277, h: 172 } : { w: 190, h: 260 }; // mm úteis na A4
  const N = [1, 2, 5, 10, 20, 25, 50, 75, 100, 125, 150, 200, 250, 500, 1000].find(n => Wcm * 10 / n <= papel.w && Hcm * 10 / n <= papel.h) || 1000;
  const s = 37.795 / N; // px CSS por cm do desenho, no papel
  const svgTxt = svgExport(s, 1, b, Wcm * s, Hcm * s).replace(/width="[^"]+" height="[^"]+"/, `width="${Wcm * 10 / N}mm" height="${Hcm * 10 / N}mm"`);
  return `<section class="pg-${paisagem ? 'p' : 'r'}"><div class="cab"><div><b>${esc(S.doc.nome)}</b> · ${esc(folhaAtual().nome)}<br>${new Date().toLocaleDateString('pt-BR')}</div><div style="text-align:right"><b>Escala 1:${N}</b><br>medidas em ${cfg.unidade}</div></div>${svgTxt}</section>`;
}
function imprimirEscala(todas) {
  sincronizarFolha();
  const atual = S.folha, idx = todas ? S.doc.folhas.map((_, k) => k) : [atual];
  let html = '';
  for (const k of idx) { if (k !== S.folha) { S.folha = k; S.doc.objs = S.doc.folhas[k].objs; S.doc.vista = S.doc.folhas[k].vista || { s: 1, ox: 0, oy: 0 }; } const pg = paginaEscala(); if (pg) html += pg; }
  if (S.folha !== atual) { S.folha = atual; S.doc.objs = S.doc.folhas[atual].objs; S.doc.vista = S.doc.folhas[atual].vista; }
  if (!html) { toast('O desenho está vazio.'); return; }
  let st = document.getElementById('pgEstilo'); if (!st) { st = document.createElement('style'); st.id = 'pgEstilo'; document.head.append(st); }
  st.textContent = `@page paisagem{size:A4 landscape;margin:10mm}@page retrato{size:A4 portrait;margin:10mm}#print .pg-p{page:paisagem;break-after:page}#print .pg-r{page:retrato;break-after:page}#print section:last-child{break-after:auto}`;
  $('#print').innerHTML = html;
  setTimeout(() => window.print(), 100);
}
function dlgConfig() {
  const dlg = $('#dlg'); dlg.innerHTML = ''; const t = { ...cfg };
  dlg.append(h('div', { class: 'dlg' }, h('h2', {}, 'Configurações'),
    h('div', { class: 'duo' },
      h('label', { class: 'f' }, h('span', {}, 'Unidade das medidas'), h('select', { class: 'i', onchange: e => t.unidade = e.target.value },
        [['cm', 'Centímetros'], ['mm', 'Milímetros'], ['m', 'Metros']].map(([k, n]) => h('option', { value: k, selected: t.unidade === k }, n)))),
      h('label', { class: 'f' }, h('span', {}, 'Passo do ímã'), h('select', { class: 'i', onchange: e => t.passo = +e.target.value },
        [1, 5, 10].map(k => h('option', { value: k, selected: t.passo === k }, k + ' cm'))))),
    h('label', { class: 'chk' }, h('input', { type: 'checkbox', checked: t.dedo, onchange: e => t.dedo = e.target.checked }), 'Desenhar também com o dedo (a tela passa a mover só com dois dedos)'),
    h('p', { class: 'hint' }, `Esquadro ${VERSAO}`),
    h('div', { class: 'row', style: 'margin-top:10px' }, h('span', { class: 'sp' }),
      h('button', { class: 'btn lite', onclick: () => dlg.close() }, 'Cancelar'),
      h('button', { class: 'btn pri', onclick: () => { Object.assign(cfg, t); salvarCfg(); dlg.close(); toast('Configurações salvas.'); } }, 'Salvar'))));
  dlg.showModal();
}
const salvarCfg = () => DB.put('config', { k: 'cfg', v: { ...cfg } }).catch(() => {});
function dlgBackup() {
  const dlg = $('#dlg'); dlg.innerHTML = '';
  $('#arqBackup').onchange = async ev => {
    const f = ev.target.files[0]; ev.target.value = ''; if (!f) return; dlg.close();
    try { const d = JSON.parse(await f.text()); if (d.app !== 'esquadro' || !Array.isArray(d.desenhos)) throw 0; for (const x of d.desenhos) await DB.put('desenhos', x); toast(`${d.desenhos.length} desenho(s) restaurado(s).`); irLista(); }
    catch (e) { toast('Esse arquivo não é um backup do Esquadro.'); }
  };
  dlg.append(h('div', { class: 'dlg' }, h('h2', {}, 'Backup'),
    h('p', {}, 'Os desenhos ficam só neste tablet. Exporte um backup de vez em quando e guarde no Drive.'),
    h('div', { class: 'row', style: 'margin-top:14px' },
      h('button', { class: 'btn pri', onclick: async () => { dlg.close(); const ds = await DB.all('desenhos'); baixar(new Blob([JSON.stringify({ app: 'esquadro', versao: 2, desenhos: ds })], { type: 'application/json' }), `esquadro-backup-${new Date().toISOString().slice(0, 10)}.json`); } }, 'Exportar todos'),
      h('button', { class: 'btn lite', onclick: () => $('#arqBackup').click() }, 'Restaurar'),
      h('span', { class: 'sp' }), h('button', { class: 'btn lite', onclick: () => dlg.close() }, 'Fechar'))));
  dlg.showModal();
}

/* ---------- teclado (para usar com teclado e mouse) ---------- */
document.addEventListener('keydown', e => {
  if (S.tela !== 'editor' || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || $('#dlg').open) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); e.shiftKey ? refazer() : desfazer(); }
  else if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); refazer(); }
  else if ((e.ctrlKey || e.metaKey) && k === 'd') { e.preventDefault(); duplicarSel(); }
  else if (k === 'delete' || k === 'backspace') { if (S.sel.length) { e.preventDefault(); excluirSel(); } }
  else if (k === 'escape') { if (S.colocar) cancelarColocar(); else if (S.galeria) { S.galeria = false; montarGaleria(); ferramentas(); } else if (S.poli) cancelarPoli(); else { S.sel = []; desenhar(); painel(); } }
  else if (k === 'enter' && S.poli) finalizarPoli();
});

/* ---------- início ---------- */
(async function iniciar() {
  await DB.abrir();
  try { const c = await DB.get('config', 'cfg'); if (c) Object.assign(cfg, c.v); } catch (e) {}
  try { S.bibUser = await DB.all('biblioteca'); } catch (e) { S.bibUser = []; }
  if (DB.ok && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (document.fonts) document.fonts.ready.then(() => desenhar());
  irLista();
})();
</script>
